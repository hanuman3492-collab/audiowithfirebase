<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0">

<title>Hari Audio Surveillance</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>

:root{
    --primary:#007bff;
}

body{
    margin:0;
    font-family:Arial,sans-serif;

    background-image:
    linear-gradient(
    rgba(0,0,0,0.65),
    rgba(0,0,0,0.65)),

    url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1920&auto=format&fit=crop');

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    min-height:100vh;
}

/* LOGIN */

#loginOverlay{
    position:fixed;
    inset:0;
    background:#f0f2f5;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.login-card{
    background:white;
    padding:40px;
    border-radius:25px;
    width:90%;
    max-width:400px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.login-card input{
    width:100%;
    padding:15px;
    margin-top:15px;
    border-radius:12px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

.login-card button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:12px;
    background:var(--primary);
    color:white;
    font-size:1rem;
    cursor:pointer;
}

/* DASHBOARD */

#dashboard{
    display:none;
    padding:20px;
}

.topbar{
    background:rgba(255,255,255,0.92);
    border-radius:20px;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(320px,1fr));

    gap:25px;
}

.card{
    background:rgba(255,255,255,0.92);

    border-radius:25px;

    padding:25px;

    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.status-box{
    margin-top:20px;
    padding:15px;
    border-radius:15px;
    font-weight:bold;
    text-align:center;
}

/* AUDIO PLAYER */

#audioList{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:20px;
}

.audio-item{
    background:#f7fafc;
    border-radius:15px;
    padding:15px;
}

audio{
    width:100%;
    margin-top:10px;
}

/* BUTTONS */

.action-btn{
    border:none;
    padding:15px;
    border-radius:15px;
    cursor:pointer;
    font-weight:bold;
    width:100%;
    margin-top:15px;
}

.logout{
    background:#444;
    color:white;
}

@media(max-width:700px){

    .topbar{
        flex-direction:column;
        gap:10px;
        text-align:center;
    }
}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="loginOverlay">

    <div class="login-card">

        <h1>
            <i class="fas fa-microphone"></i>
            Hari Audio AI
        </h1>

        <p style="color:#666;">
            Smart Surveillance System
        </p>

        <input type="email"
        id="email"
        placeholder="Enter Email">

        <input type="password"
        id="password"
        placeholder="Enter Password">

        <button id="loginBtn">
            Login
        </button>

        <p id="loginError"
        style="
        color:red;
        display:none;
        margin-top:15px;">
        </p>

    </div>

</div>

<!-- DASHBOARD -->

<div id="dashboard">

    <!-- TOPBAR -->

    <div class="topbar">

        <div>

            <h2 style="margin:0;">
                <i class="fas fa-shield-alt"></i>
                AUDIO SURVEILLANCE
            </h2>

            <small>
                Firebase Smart Monitoring
            </small>

        </div>

        <div>

            <h3 id="clock"
            style="
            margin:0;
            color:var(--primary);">
            </h3>

        </div>

    </div>

    <!-- GRID -->

    <div class="grid">

        <!-- SYSTEM STATUS -->

        <div class="card">

            <small style="
            font-weight:bold;
            color:#777;">

            SYSTEM STATUS

            </small>

            <h1 style="
            font-size:3rem;
            margin-top:25px;
            color:#007bff;">

                <i class="fas fa-wave-square"></i>

            </h1>

            <div id="systemStatus"
            class="status-box"
            style="
            background:#f0fff4;
            color:#2f855a;">

            LISTENING FOR AUDIO...

            </div>

        </div>

        <!-- AUDIO RECORDINGS -->

        <div class="card">

            <small style="
            font-weight:bold;
            color:#777;">

            AUDIO RECORDINGS

            </small>

            <div id="audioList">

            </div>

        </div>

    </div>

    <!-- LOGOUT -->

    <button id="logoutBtn"
    class="action-btn logout">

    Logout

    </button>

</div>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>

/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey:
    "AIzaSyBNOdjL_mDvkOk5Q5Qfzt_3COU8MV06xxs",

    authDomain:
    "audiowithfirebase-b3d3f.firebaseapp.com",

    databaseURL:
    "https://audiowithfirebase-b3d3f-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "audiowithfirebase-b3d3f"

};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.database();

/* CLOCK */

setInterval(() => {

    document.getElementById("clock")
    .innerText =
    new Date().toLocaleTimeString();

},1000);

/* LOGIN */

document.getElementById("loginBtn")
.onclick = () => {

    const email =
    document.getElementById("email").value;

    const password =
    document.getElementById("password").value;

    auth.signInWithEmailAndPassword(
    email,password)

    .then(() => {

        document.getElementById(
        "loginOverlay").style.display =
        "none";

        document.getElementById(
        "dashboard").style.display =
        "block";

        startSync();

    })

    .catch(error => {

        const err =
        document.getElementById(
        "loginError");

        err.style.display = "block";

        err.innerText = error.message;

    });

};

/* AUDIO SYNC */

function startSync(){

    db.ref("audioFiles")
    .on("child_added", snap => {

        const url = snap.val();

        const list =
        document.getElementById(
        "audioList");

        const item =
        document.createElement("div");

        item.className =
        "audio-item";

        item.innerHTML = `

        <strong>
        Audio Recording
        </strong>

        <audio controls>

            <source src="${url}"
            type="audio/wav">

        </audio>

        `;

        list.prepend(item);

    });

}

/* LOGOUT */

document.getElementById("logoutBtn")
.onclick = () => {

    auth.signOut()
    .then(() => {

        location.reload();

    });

};

/* INTERNET */

window.addEventListener(
"offline", () => {

    alert(
    "Internet Disconnected");

});

</script>

</body>
</html>
